# Pipeline: roda os testes e publica a imagem da branch escolhida no GHCR.
# Execução manual: Actions > Pipeline > Run workflow > escolher a branch.
name: Pipeline

on:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/gerenciador-gastos-web

jobs:
  build:
    name: Testes e imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Testes
        run: |
          npm ci
          npm test -- --watch=false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagem publicada"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Próximo passo: **Actions > Release** na branch \`$GITHUB_REF_NAME\`."
          } >> "$GITHUB_STEP_SUMMARY"
