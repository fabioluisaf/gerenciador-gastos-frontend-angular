# Pipeline: roda os testes e publica no GHCR a imagem da tag escolhida.
# Execução manual: Actions > Pipeline > Run workflow > Use workflow from > Tags > escolher a tag (ex.: 1.1.1).
name: Pipeline

on:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/gerenciador-gastos-web

jobs:
  build:
    name: Testes e imagem ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Validar tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Rode a Pipeline a partir de uma tag (Use workflow from > Tags), não da branch $GITHUB_REF_NAME."
            exit 1
          fi
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::A tag $GITHUB_REF_NAME não está no formato X.Y.Z (ex.: 1.1.1)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Testes
        run: |
          npm ci
          npm test -- --watch=false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=short

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSAO=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagem publicada"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Próximo passo: **Actions > Release** na tag \`$GITHUB_REF_NAME\`."
          } >> "$GITHUB_STEP_SUMMARY"
