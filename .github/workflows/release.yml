# Release: publica em produção a imagem gerada pela Pipeline na mesma branch.
# Execução manual: Actions > Release > Run workflow > escolher a branch e informar a versão.
#
# Cria a tag X.Y.Z na imagem, atualiza o repositório gerenciador-gastos-deploy
# e cria a tag git vX.Y.Z com a GitHub Release.
# O deploy em si é feito pelo Argo CD, que observa o repositório de deploy.
# Requer o secret DEPLOY_TOKEN (token com permissão de escrita no repositório de deploy).
name: Release

on:
  workflow_dispatch:
    inputs:
      versao:
        description: Versão no formato X.Y.Z (ex. 1.1.0)
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/gerenciador-gastos-web
  REPO_DEPLOY: ${{ github.repository_owner }}/gerenciador-gastos-deploy
  VERSAO: ${{ inputs.versao }}

jobs:
  release:
    name: Release ${{ inputs.versao }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Validar versão
        id: versao
        run: |
          if ! printf '%s' "$VERSAO" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Informe a versão no formato X.Y.Z (ex.: 1.1.0)."
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$VERSAO" > /dev/null; then
            echo "::error::A tag v$VERSAO já existe. Informe uma nova versão."
            exit 1
          fi
          echo "origem=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar tag da versão na imagem
        env:
          ORIGEM: ${{ steps.versao.outputs.origem }}
        run: |
          if ! docker buildx imagetools inspect "$IMAGEM:$ORIGEM" > /dev/null; then
            echo "::error::Imagem $IMAGEM:$ORIGEM não encontrada. Rode a Pipeline na branch $GITHUB_REF_NAME antes."
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGEM:$VERSAO" "$IMAGEM:$ORIGEM"

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.REPO_DEPLOY }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deploy

      - name: Atualizar repositório de deploy
        working-directory: deploy/overlays/prod
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGEM))).newTag = strenv(VERSAO)' kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Produção já está com $IMAGEM:$VERSAO."
            exit 0
          fi
          git commit -m "release(web): $VERSAO" -m "Origem: $GITHUB_REPOSITORY@$GITHUB_SHA ($GITHUB_REF_NAME)"

          for tentativa in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejeitado (tentativa $tentativa), sincronizando..."
            git pull --rebase
          done
          exit 1

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSAO" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSAO" \
            --generate-notes

      - name: Resumo
        run: |
          {
            echo "### Release $VERSAO"
            echo "- Imagem: \`$IMAGEM:$VERSAO\`"
            echo "- Branch: \`$GITHUB_REF_NAME\` (\`${GITHUB_SHA::7}\`)"
            echo "- O Argo CD aplica a mudança em até 3 minutos (ou clique em *Refresh* na aplicação gerenciador-gastos-prod)."
          } >> "$GITHUB_STEP_SUMMARY"
