# Release: publica em produção a imagem gerada pela Pipeline na tag escolhida.
# Execução manual: Actions > Release > Run workflow > Use workflow from > Tags > escolher a tag.
#
# Atualiza o repositório gerenciador-gastos-deploy (o Argo CD faz o deploy)
# e cria a GitHub Release da tag, se ainda não existir.
# Rodar em uma tag antiga faz rollback de produção para aquela versão.
# Requer o secret DEPLOY_TOKEN (token com permissão de escrita no repositório de deploy).
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/gerenciador-gastos-web
  REPO_DEPLOY: ${{ github.repository_owner }}/gerenciador-gastos-deploy
  VERSAO: ${{ github.ref_name }}

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Validar tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Rode a Release a partir de uma tag (Use workflow from > Tags), não da branch $GITHUB_REF_NAME."
            exit 1
          fi
          if ! printf '%s' "$VERSAO" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::A tag $VERSAO não está no formato X.Y.Z (ex.: 1.1.1)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Conferir imagem da Pipeline
        run: |
          if ! docker buildx imagetools inspect "$IMAGEM:$VERSAO" > /dev/null; then
            echo "::error::Imagem $IMAGEM:$VERSAO não encontrada. Rode a Pipeline na tag $VERSAO antes."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.REPO_DEPLOY }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deploy

      - name: Atualizar repositório de deploy
        working-directory: deploy/overlays/prod
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGEM))).newTag = strenv(VERSAO)' kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Produção já está com $IMAGEM:$VERSAO."
            exit 0
          fi
          git commit -m "release(web): $VERSAO" -m "Origem: $GITHUB_REPOSITORY@$GITHUB_SHA"

          for tentativa in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejeitado (tentativa $tentativa), sincronizando..."
            git pull --rebase
          done
          exit 1

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSAO" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A GitHub Release $VERSAO já existe (redeploy/rollback)."
          else
            gh release create "$VERSAO" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$VERSAO" \
              --generate-notes
          fi

      - name: Resumo
        run: |
          {
            echo "### Release $VERSAO"
            echo "- Imagem: \`$IMAGEM:$VERSAO\`"
            echo "- O Argo CD aplica a mudança em até 3 minutos (ou clique em *Refresh* na aplicação gerenciador-gastos-prod)."
          } >> "$GITHUB_STEP_SUMMARY"
