@if (startLabel(); as label) {
  <div
    class="swipe-side start"
    [attr.aria-hidden]="openSide() !== 'start'"
    [attr.inert]="openSide() === 'start' ? null : ''"
  >
    <button appSwipeAction class="primary start" [label]="label" (click)="trigger('start', $event)">
      <ng-content select="[swipeStartIcon]" />
    </button>
    <ng-content select="[appSwipeAction]" />
  </div>
}
@if (endLabel(); as label) {
  <div
    class="swipe-side end"
    [attr.aria-hidden]="openSide() !== 'end'"
    [attr.inert]="openSide() === 'end' ? null : ''"
  >
    <button appSwipeAction class="primary end" [label]="label" (click)="trigger('end', $event)">
      <ng-content select="[swipeEndIcon]" />
    </button>
  </div>
}
<div class="swipe-content">
  <ng-content />
</div>
