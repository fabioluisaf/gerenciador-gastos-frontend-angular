<div
  #track
  class="track"
  role="slider"
  tabindex="0"
  aria-orientation="vertical"
  aria-valuemin="0"
  [attr.aria-label]="label()"
  [attr.aria-valuemax]="marks().length - 1"
  [attr.aria-valuenow]="currentIndex()"
  [attr.aria-valuetext]="current()?.label"
  [class.dragging]="dragging()"
  (pointerdown)="startDrag($event)"
  (pointermove)="drag($event)"
  (pointerup)="endDrag()"
  (pointercancel)="cancelDrag()"
  (keydown)="navigateWithKeyboard($event)"
>
  @if (current(); as mark) {
    <div class="thumb" [style.--position]="mark.position">
      <span class="bubble">{{ mark.label }}</span>
    </div>
  }
</div>
