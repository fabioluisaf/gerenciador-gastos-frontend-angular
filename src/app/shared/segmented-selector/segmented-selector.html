@if (labelVisible()) {
  <span class="label" [id]="id + '-label'">{{ label() }}</span>
}

@if (navigates()) {
  <nav class="options" [appSlidingIndicator]="memoryKey()" [attr.aria-label]="label()">
    @for (option of options(); track option.value) {
      <a
        class="option"
        [routerLink]="option.link"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="option.exact ? exactMatch : prefixMatch"
      >
        <ng-container
          [ngTemplateOutlet]="icon() ?? null"
          [ngTemplateOutletContext]="{ $implicit: option }"
        />
        <span class="option-label">{{ option.label }}</span>
      </a>
    }
  </nav>
} @else if (scrollable()) {
  <div
    class="options scrollable"
    role="radiogroup"
    appHorizontalWheelScroll
    appDragScroll
    followActive
    [appSlidingIndicator]="memoryKey()"
    [attr.aria-labelledby]="labelVisible() ? id + '-label' : null"
    [attr.aria-label]="labelVisible() ? null : label()"
  >
    <ng-container [ngTemplateOutlet]="choices" />
  </div>
} @else {
  <div
    class="options"
    role="radiogroup"
    [class.wrapped]="columns() !== null"
    [style.grid-template-columns]="columns() ? 'repeat(' + columns() + ', minmax(0, 1fr))' : null"
    [appSlidingIndicator]="memoryKey()"
    [attr.aria-labelledby]="labelVisible() ? id + '-label' : null"
    [attr.aria-label]="labelVisible() ? null : label()"
  >
    <ng-container [ngTemplateOutlet]="choices" />
  </div>
}

<ng-template #choices>
  @for (option of options(); track option.value) {
    <label class="option" [class.active]="option.value === value()">
      <input
        type="radio"
        class="visually-hidden"
        [name]="id"
        [value]="option.value"
        [checked]="option.value === value()"
        (change)="valueChange.emit(option.value)"
      />
      <ng-container
        [ngTemplateOutlet]="icon() ?? null"
        [ngTemplateOutletContext]="{ $implicit: option }"
      />
      <span class="option-label">{{ option.label }}</span>
    </label>
  }
</ng-template>
