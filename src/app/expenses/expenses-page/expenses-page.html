<h1 class="visually-hidden">{{ heading() }}</h1>

<div class="layout">
  <div class="list-column">
    <div class="list-header">
      <div class="header-row">
        <app-expense-kind-toggle class="kind-toggle" />
        <button
          type="button"
          class="search-toggle"
          [attr.aria-label]="searchVisible() ? 'Fechar busca por nome' : 'Buscar por nome'"
          [attr.aria-expanded]="searchVisible()"
          (click)="toggleSearch()"
        >
          @if (searchVisible()) {
            <svg lucideX aria-hidden="true"></svg>
          } @else {
            <svg lucideSearch aria-hidden="true"></svg>
          }
        </button>
      </div>
      @if (searchVisible()) {
        <app-expense-name-search />
      }
      @if (filters().length > 0) {
        <app-expense-filter-bar [filters]="filters()" (removed)="toggleFilter($event)" />
      }
    </div>
    <app-expense-list
      class="list"
      [class.below-filter-bar]="filters().length > 0"
      [class.below-search]="searchVisible()"
      [kind]="kind()"
      [filters]="filters()"
      [(activePeriod)]="activePeriod"
      (expenseDeleted)="refreshSummaries()"
    />
  </div>

  <aside
    class="side-panel"
    aria-label="Totais do mês"
    appContainScroll
    [attr.aria-busy]="totals.isLoading()"
  >
    <ng-container [ngTemplateOutlet]="totalsContent" />
  </aside>
</div>

<button
  type="button"
  class="mini-player"
  aria-haspopup="dialog"
  [attr.aria-expanded]="sheetOpen()"
  (click)="openSheet()"
  (appSwipeUp)="openSheet()"
>
  <span class="mini-player-text">
    @if (filters().length > 0) {
      <span class="mini-player-label">Filtrados em {{ periodLabel() }}</span>
      <span class="mini-player-amount" [class.stale]="filteredTotals.isLoading()">
        @if (shownFilteredTotals(); as filtered) {
          {{ filtered.realized | currency }}
        } @else {
          Carregando…
        }
      </span>
    } @else {
      <span class="mini-player-label">Total de {{ periodLabel() }}</span>
      <span class="mini-player-amount" [class.stale]="totals.isLoading()">
        @if (shownTotals(); as monthTotals) {
          {{ monthTotals.realized | currency }}
        } @else {
          Carregando…
        }
      </span>
    }
  </span>
  <svg lucideChevronUp aria-hidden="true"></svg>
</button>

<app-bottom-sheet class="sheet" label="Totais do mês" (closed)="onSheetClosed()">
  <ng-container [ngTemplateOutlet]="totalsContent" />
</app-bottom-sheet>

<ng-template #totalsContent>
  <app-month-strip
    class="month-strip"
    label="Mês dos totais"
    [months]="months()"
    [selected]="period()"
    (monthSelected)="selectMonth($event)"
  />
  @if (filters().length > 0) {
    <app-filtered-total
      class="filtered-total"
      [class.stale]="filteredTotals.isLoading()"
      [realized]="shownFilteredTotals()?.realized ?? null"
      [planned]="shownFilteredTotals()?.planned ?? null"
      (cleared)="clearFilters()"
    />
  }
  @if (shownTotals(); as monthTotals) {
    <app-month-totals
      [class.stale]="totals.isLoading()"
      [totals]="monthTotals"
      [periodLabel]="periodLabel()"
      [kind]="kind()"
      [activeFilters]="filters()"
      (filterToggled)="toggleFilter($event)"
    />
  } @else if (totals.error()) {
    <p class="totals-feedback">
      Não foi possível carregar os totais.
      <button type="button" class="retry" (click)="totals.reload()">Tentar novamente</button>
    </p>
  } @else {
    <p class="totals-feedback">Carregando totais…</p>
  }
</ng-template>
