<nav class="control-bar" aria-label="Controles" appSlidingIndicator>
  <a
    class="control"
    routerLink="/gastos"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    aria-label="Gastos"
  >
    <svg lucideReceiptText aria-hidden="true"></svg>
  </a>
  <a
    class="control"
    routerLink="/metodos-pagamento"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    aria-label="Métodos de pagamento"
  >
    <svg lucideWalletCards aria-hidden="true"></svg>
  </a>
  <button
    type="button"
    class="control create"
    aria-label="Criar"
    aria-haspopup="dialog"
    [attr.aria-expanded]="createOpen()"
    (click)="createRequested.emit()"
  >
    <svg lucidePlus aria-hidden="true"></svg>
  </button>
  <a
    class="control"
    routerLink="/faturas"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    aria-label="Faturas"
  >
    <svg lucideCalendarClock aria-hidden="true"></svg>
  </a>
  <button
    type="button"
    class="control"
    aria-label="Configurações"
    aria-haspopup="dialog"
    [attr.aria-expanded]="settingsOpen()"
    (click)="settingsRequested.emit()"
  >
    <svg lucideSettings aria-hidden="true"></svg>
  </button>
</nav>
