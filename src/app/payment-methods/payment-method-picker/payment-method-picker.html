<div
  class="methods"
  role="radiogroup"
  appHorizontalWheelScroll
  appDragScroll
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-invalid]="invalid() ? true : null"
>
  @for (method of methods(); track method.id) {
    <label
      class="method"
      [class.selected]="method.id === value()"
      [style.--method-color]="method.institution.color"
    >
      <input
        type="radio"
        class="visually-hidden"
        [name]="name"
        [value]="method.id"
        [checked]="method.id === value()"
        (change)="valueChange.emit(method.id)"
      />
      @if (method.institution.iconUrl; as iconUrl) {
        <img class="method-icon" [ngSrc]="iconUrl" width="24" height="24" alt="" />
      }
      <span class="method-text">
        <span class="method-name">{{ method.name }}</span>
        <span class="method-type">{{ typeLabels[method.paymentType] }}</span>
      </span>
    </label>
  }
</div>
